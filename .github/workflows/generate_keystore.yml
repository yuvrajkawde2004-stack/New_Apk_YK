name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass password123 -keypass password123 -dname "CN=RetailFlow, OU=App, O=Retail, L=City, S=State, C=IN"
          
      - name: Get SHA-1 and SHA-256
        run: |
          keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass password123 -keypass password123 > keystore_info.txt
          cat keystore_info.txt

      - name: Commit Keystore to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add android/app/upload-keystore.jks
          git commit -m "Add upload keystore"
          git push
